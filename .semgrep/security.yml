rules:
  - id: fasttimes.kotlin.security.weak-message-digest
    languages: [kotlin]
    severity: ERROR
    message: Use a collision-resistant digest such as SHA-256 instead of MD5 or SHA-1.
    metadata:
      category: security
      cwe: CWE-328
      confidence: HIGH
    # JCA algorithm lookup is case-insensitive and accepts SHA1 as well as SHA-1,
    # so the spellings below must all be caught, not just the canonical uppercase one.
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance($ALGORITHM)
          - pattern: java.security.MessageDigest.getInstance($ALGORITHM)
      - metavariable-regex:
          metavariable: $ALGORITHM
          regex: '(?i)^"(md5|sha-?1)"$'

  - id: fasttimes.kotlin.security.ecb-cipher
    languages: [kotlin]
    severity: ERROR
    message: ECB mode leaks plaintext patterns; use an authenticated mode such as AES/GCM.
    metadata:
      category: security
      cwe: CWE-327
      confidence: HIGH
    # Bare "AES" defaults to ECB, and the transformation string is case-insensitive.
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($TRANSFORMATION)
          - pattern: javax.crypto.Cipher.getInstance($TRANSFORMATION)
      - metavariable-regex:
          metavariable: $TRANSFORMATION
          regex: '(?i)^"aes(?:/ecb(?:/[^\"]*)?)?"$'

  - id: fasttimes.android.security.webview-file-url-access
    languages: [kotlin]
    severity: ERROR
    message: Do not enable WebView file-URL cross-origin access.
    metadata:
      category: security
      cwe: CWE-939
      confidence: HIGH
    pattern-either:
      - pattern: $SETTINGS.allowFileAccessFromFileURLs = true
      - pattern: $SETTINGS.allowUniversalAccessFromFileURLs = true
      - pattern: $SETTINGS.setAllowFileAccessFromFileURLs(true)
      - pattern: $SETTINGS.setAllowUniversalAccessFromFileURLs(true)

  - id: fasttimes.android.security.pending-intent-without-mutability
    languages: [kotlin]
    severity: ERROR
    message: PendingIntent must declare FLAG_IMMUTABLE or FLAG_MUTABLE explicitly.
    metadata:
      category: security
      cwe: CWE-926
      confidence: HIGH
    # Any flags expression that names neither mutability bit is a finding — a literal 0
    # is only the most obvious spelling of it.
    patterns:
      - pattern-either:
          - pattern: PendingIntent.getActivity($CONTEXT, $REQUEST, $INTENT, $FLAGS)
          - pattern: PendingIntent.getBroadcast($CONTEXT, $REQUEST, $INTENT, $FLAGS)
          - pattern: PendingIntent.getService($CONTEXT, $REQUEST, $INTENT, $FLAGS)
      - metavariable-regex:
          metavariable: $FLAGS
          regex: '(?s)^(?!.*FLAG_(?:IMMUTABLE|MUTABLE)).*$'
