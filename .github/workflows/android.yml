name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and source gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Run Spotless check
        run: ./gradlew spotlessCheck

      - name: Run Android lint
        run: ./gradlew lintFossDebug

      - name: Run unit tests
        run: ./gradlew testFossDebugUnitTest

      - name: Generate unit-test coverage
        run: ./gradlew jacocoFossDebugReport

      - name: Run Semgrep security rules
        run: scripts/semgrep.sh

      - name: Build debug APK
        run: ./gradlew assembleFossDebug

      - name: Verify instrumentation result parser
        run: scripts/connected-tests.sh --self-test

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error

  instrumentation:
    name: Connected instrumentation (API 36)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ANDROID_SERIAL=emulator-5554 scripts/connected-tests.sh
